<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMS Jr. — Frontend</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
  />
  <link rel="stylesheet" href="/frontend/app.css" />
</head>
<body class="hold-transition layout-top-nav">
  <div class="wrapper">
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
      <div class="container">
        <a href="#" class="navbar-brand">CMS Jr.</a>
        <div class="navbar-nav ms-auto" id="nav-actions">
          <a class="nav-item nav-link d-none" id="nav-projects" href="#">Projects</a>
          <a class="nav-item nav-link d-none" id="nav-logout" href="#">Logout</a>
          <a class="nav-item nav-link" id="nav-login" href="#">Login</a>
        </div>
      </div>
    </nav>

    <div class="content-wrapper">
      <div class="content-header">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-sm-6"><h1 class="m-0" id="page-title">CMS Jr.</h1></div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="container-fluid">
          <div id="alert-area"></div>

          <!-- Login -->
          <section id="login-section">
            <div class="card card-primary">
              <div class="card-header">Sign in</div>
              <div class="card-body">
                <form id="login-form">
                  <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required />
                  </div>
                  <button type="submit" class="btn btn-primary">Sign in</button>
                </form>
              </div>
            </div>
          </section>

          <!-- Projects list -->
          <section id="projects-section" class="d-none">
            <div class="card">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>Projects</span>
                <button class="btn btn-sm btn-success" id="btn-new-project">New project</button>
              </div>
              <div class="card-body p-0" id="projects-list">
                <p class="text-center p-3">Loading projects...</p>
              </div>
              <div class="card-footer" id="projects-pagination"></div>
            </div>
            <div class="mt-3 d-none" id="create-project-section">
              <div class="card card-info">
                <div class="card-header">Create project</div>
                <div class="card-body">
                  <form id="create-project-form">
                    <div class="mb-3">
                      <label class="form-label">Project name</label>
                      <input type="text" name="name" class="form-control" required minlength="3" />
                    </div>
                    <button type="submit" class="btn btn-info">Create</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancel-project">Cancel</button>
                  </form>
                </div>
              </div>
            </div>
          </section>

          <!-- Project detail -->
          <section id="project-detail-section" class="d-none">
            <div class="card">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span id="detail-project-name">Project</span>
                <div>
                  <button class="btn btn-sm btn-outline-danger" id="btn-delete-project">Delete project</button>
                  <a class="btn btn-sm btn-secondary" id="btn-back-to-list">Back</a>
                </div>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input type="text" id="detail-name" class="form-control" readonly />
                </div>
                <div class="mb-3">
                  <label class="form-label">Owner</label>
                  <input type="text" id="detail-owner" class="form-control" readonly />
                </div>
                <div class="mb-3">
                  <label class="form-label">Created at</label>
                  <input type="text" id="detail-created" class="form-control" readonly />
                </div>

                <h5>Assets</h5>
                <form id="create-asset-form" class="mb-3">
                  <div class="row g-2">
                    <div class="col-md-4">
                      <input type="text" name="name" class="form-control" placeholder="Asset name" required />
                    </div>
                    <div class="col-md-4">
                      <select name="asset_type" class="form-select">
                        <option value="IMAGE">IMAGE</option>
                        <option value="VIDEO">VIDEO</option>
                        <option value="MODEL_3D">MODEL_3D</option>
                      </select>
                    </div>
                    <div class="col-md-3">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_public" id="asset-public" />
                        <label class="form-check-label" for="asset-public">Public</label>
                      </div>
                    </div>
                    <div class="col-md-1">
                      <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                  </div>
                </form>

                <div id="assets-list"></div>
                <div id="assets-pagination" class="mt-2"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/app.js"></script>
</body>
</html>
